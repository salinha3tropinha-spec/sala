<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Restrito | Sala ADM Cloud Core</title>
    <!-- Favicon Oficial -->
    <link rel="icon" type="image/png" href="logo-maykon.png">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-20px) scale(1.05); }
        }
        @keyframes pulseGlow {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.8; }
        }
        .blob-1 { animation: floatSlow 10s ease-in-out infinite; }
        .glow-pulse { animation: pulseGlow 4s ease-in-out infinite; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        .shake-error { animation: shake 0.4s ease-in-out; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #030712; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 9999px; }
    </style>
</head>
<body class="bg-[#030712] text-slate-100 antialiased min-h-screen flex items-center justify-center relative overflow-hidden selection:bg-sky-500 selection:text-white">

    <!-- Container de Notificações Toast -->
    <div id="toast-container" class="fixed top-6 right-6 z-50 flex flex-col gap-3 pointer-events-none"></div>

    <!-- Background Atmosférico com Mesh Gradients Avançados -->
    <div class="absolute top-1/3 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-gradient-to-tr from-sky-600/10 via-indigo-600/15 to-purple-600/10 rounded-full blur-[140px] pointer-events-none blob-1"></div>
    <div class="absolute bottom-10 left-10 w-96 h-96 bg-blue-500/5 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="absolute top-10 right-10 w-96 h-96 bg-violet-500/5 rounded-full blur-[120px] pointer-events-none"></div>
    
    <!-- Pattern de Grade Geométrica High-Tech -->
    <div class="absolute inset-0 bg-[linear-gradient(to_right,#1e293b0a_1px,transparent_1px),linear-gradient(to_bottom,#1e293b0a_1px,transparent_1px)] bg-[size:4rem_4rem] [mask-image:radial-gradient(ellipse_60%_50%_at_50%_50%,#000_70%,transparent_100%)] pointer-events-none"></div>

    <!-- Cartão Principal (Glassmorphism de Alta Precisão) -->
    <div id="login-card" class="relative w-full max-w-[420px] mx-4 bg-[#0b0f19]/70 backdrop-blur-2xl border border-white/[0.08] p-8 sm:p-10 rounded-[2.2rem] shadow-[0_25px_80px_rgba(0,0,0,0.85)] z-10 space-y-7 transition-all duration-300">
        
        <!-- Logotipo Exclusivo (Substituindo o Escudo Genérico por Arquitetura de Dados/Nuvem) -->
        <div class="text-center space-y-4">
            <div class="relative w-16 h-16 mx-auto group">
                <div class="absolute inset-0 bg-gradient-to-tr from-sky-400 to-indigo-600 rounded-2xl blur-xl opacity-50 glow-pulse"></div>
                <div class="relative w-16 h-16 rounded-2xl bg-gradient-to-b from-slate-800/80 to-slate-950/90 border border-white/15 flex items-center justify-center shadow-2xl">
                    <!-- SVG Customizado: Nó de Nuvem / Core de Automação -->
                    <svg class="w-8 h-8 text-sky-400 drop-shadow-[0_0_10px_rgba(56,189,248,0.5)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                        <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                        <line x1="12" y1="22.08" x2="12" y2="12"></line>
                    </svg>
                </div>
            </div>
            <div class="space-y-1">
                <h2 id="card-title" class="text-xl font-bold text-white tracking-tight">Sala ADM Cloud Core</h2>
                <p id="card-subtitle" class="text-xs text-slate-400 font-medium">Infraestrutura e Gestão de Acesso Restrito</p>
            </div>
        </div>

        <!-- FORMULÁRIO DE LOGIN -->
        <form id="login-form" onsubmit="handleLoginExternal(event)" class="space-y-4 text-xs">
            <div class="space-y-1.5">
                <label class="block font-semibold text-slate-300 tracking-wider uppercase text-[10px]">E-mail Institucional</label>
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                        <i class="fa-solid fa-at text-slate-500 group-focus-within:text-sky-400 transition-colors"></i>
                    </div>
                    <input type="email" id="login-user" placeholder="maykon.moraes@..." required class="w-full bg-black/40 hover:bg-black/60 focus:bg-black/80 border border-white/10 focus:border-sky-500/70 rounded-xl pl-10 pr-4 py-3 text-xs text-white font-mono focus:outline-none focus:ring-2 focus:ring-sky-500/20 transition-all shadow-inner">
                </div>
            </div>

            <div class="space-y-1.5">
                <div class="flex justify-between items-center">
                    <label class="block font-semibold text-slate-300 tracking-wider uppercase text-[10px]">Senha de Acesso</label>
                    <button type="button" onclick="openForgotPasswordModal()" class="text-[11px] text-sky-400 hover:text-sky-300 font-medium transition-colors">Esqueceu a senha?</button>
                </div>
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                        <i class="fa-solid fa-key text-slate-500 group-focus-within:text-sky-400 transition-colors"></i>
                    </div>
                    <input type="password" id="login-pass" placeholder="••••••••••••" required class="w-full bg-black/40 hover:bg-black/60 focus:bg-black/80 border border-white/10 focus:border-sky-500/70 rounded-xl pl-10 pr-11 py-3 text-xs text-white font-mono focus:outline-none focus:ring-2 focus:ring-sky-500/20 transition-all shadow-inner">
                    <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-500 hover:text-slate-300 transition-colors">
                        <i id="eye-icon" class="fa-solid fa-eye text-xs"></i>
                    </button>
                </div>
            </div>

            <!-- Checkbox Lembrar-me -->
            <div class="flex items-center space-x-2.5 pt-1">
                <input type="checkbox" id="remember-me" class="w-4 h-4 rounded bg-slate-950 border-slate-700 text-sky-500 focus:ring-sky-500/20 cursor-pointer accent-sky-500">
                <label for="remember-me" class="text-slate-400 cursor-pointer select-none font-medium text-[11px]">Lembrar credencial neste dispositivo</label>
            </div>

            <button type="submit" id="submit-btn" class="w-full bg-gradient-to-r from-sky-500 via-indigo-600 to-purple-600 hover:opacity-95 text-white py-3.5 rounded-xl font-bold text-xs shadow-[0_0_25px_rgba(99,102,241,0.35)] hover:shadow-[0_0_35px_rgba(99,102,241,0.6)] transition-all transform hover:-translate-y-0.5 active:translate-y-0 flex items-center justify-center gap-2 mt-2 cursor-pointer">
                <i class="fa-solid fa-right-to-bracket text-xs" id="btn-icon"></i> 
                <span id="btn-text">Autenticar na Nuvem</span>
            </button>
        </form>

        <!-- FORMULÁRIO DE REDEFINIÇÃO DE SENHA -->
        <div id="reset-password-form" class="hidden space-y-4 text-xs">
            <div class="space-y-1.5">
                <label class="block font-semibold text-slate-300 tracking-wider uppercase text-[10px]">Nova Credencial de Senha</label>
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                        <i class="fa-solid fa-lock text-slate-500 group-focus-within:text-emerald-400 transition-colors"></i>
                    </div>
                    <input type="password" id="new-password" placeholder="Mínimo de 6 caracteres" required class="w-full bg-black/40 hover:bg-black/60 focus:bg-black/80 border border-white/10 focus:border-emerald-500/70 rounded-xl pl-10 pr-4 py-3 text-xs text-white font-mono focus:outline-none focus:ring-2 focus:ring-emerald-500/20 transition-all shadow-inner">
                </div>
            </div>

            <button type="button" onclick="updateNewPassword()" id="reset-btn" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:opacity-95 text-white py-3.5 rounded-xl font-bold text-xs shadow-[0_0_25px_rgba(16,185,129,0.35)] transition-all flex items-center justify-center gap-2 mt-2 cursor-pointer">
                <i class="fa-solid fa-check text-xs"></i> 
                <span>Atualizar Senha de Acesso</span>
            </button>
        </div>

        <!-- Rodapé do Card com Status Dinâmico -->
        <div class="pt-4 border-t border-white/[0.06] flex items-center justify-between text-[11px] text-slate-500 font-mono">
            <span class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse shadow-[0_0_8px_rgba(16,185,129,0.8)]"></span> Supabase Core
            </span>
            <span class="text-sky-400 font-medium bg-sky-500/10 px-2 py-0.5 rounded border border-sky-500/20">Secure v7.2</span>
        </div>
    </div>

    <!-- MODAL DE SOLICITAÇÃO DE RECUPERAÇÃO -->
    <div id="forgot-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center hidden p-4 transition-all duration-300">
        <div class="bg-[#0b0f19] border border-white/10 w-full max-w-md rounded-3xl p-6 sm:p-8 shadow-2xl space-y-5">
            <div class="flex justify-between items-center pb-3 border-b border-white/10">
                <h3 class="text-sm font-bold text-white flex items-center gap-2"><i class="fa-solid fa-key text-sky-400"></i> Recuperação de Chave</h3>
                <button onclick="closeForgotPasswordModal()" class="text-slate-400 hover:text-white p-2 rounded-xl transition"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <p class="text-xs text-slate-300 leading-relaxed">Insira seu e-mail institucional para receber o link seguro de redefinição de credenciais.</p>
            <div class="space-y-1.5 text-xs">
                <label class="block font-semibold text-slate-300 tracking-wider uppercase text-[10px]">E-mail Institucional</label>
                <input type="email" id="recovery-email" placeholder="maykon.moraes@..." class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-3 text-white font-mono focus:outline-none focus:border-sky-500">
            </div>
            <div class="flex justify-end gap-3 pt-3 border-t border-white/10 text-xs">
                <button onclick="closeForgotPasswordModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2.5 rounded-xl font-semibold transition cursor-pointer">Cancelar</button>
                <button onclick="sendPasswordRecovery()" class="bg-sky-600 hover:bg-sky-500 text-white px-5 py-2.5 rounded-xl font-bold shadow-lg transition cursor-pointer">Enviar Link</button>
            </div>
        </div>
    </div>

    <!-- Script de Autenticação e UX Avançada -->
    <script>
        const SUPABASE_URL = 'https://wukxupvwnagtdbvwdqlt.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_-wMyexJm-TEbqx_CtYr-9Q_2ASKEBfs';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        window.addEventListener('DOMContentLoaded', () => {
            const savedEmail = localStorage.getItem('saved_login_email');
            if (savedEmail) {
                document.getElementById('login-user').value = savedEmail;
                document.getElementById('remember-me').checked = true;
            }
        });

        supabaseClient.auth.onAuthStateChange(async (event, session) => {
            if (event === 'PASSWORD_RECOVERY') {
                document.getElementById('login-form').classList.add('hidden');
                document.getElementById('reset-password-form').classList.remove('hidden');
                document.getElementById('card-title').innerText = 'Redefinição de Senha';
                document.getElementById('card-subtitle').innerText = 'Insira sua nova credencial de acesso';
            } else if (session && event !== 'PASSWORD_RECOVERY' && !window.location.hash.includes('type=recovery')) {
                window.location.href = 'painel.html';
            }
        });

        if (window.location.hash && window.location.hash.includes('type=recovery')) {
            document.getElementById('login-form').classList.add('hidden');
            document.getElementById('reset-password-form').classList.remove('hidden');
            document.getElementById('card-title').innerText = 'Redefinição de Senha';
            document.getElementById('card-subtitle').innerText = 'Insira sua nova credencial de acesso';
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            const isSuccess = type === 'success';
            
            toast.className = `pointer-events-auto flex items-center space-x-3 px-4 py-3 rounded-2xl bg-slate-900/90 backdrop-blur-xl border ${isSuccess ? 'border-emerald-500/30 text-emerald-400' : 'border-rose-500/30 text-rose-400'} shadow-2xl transition-all duration-300 transform translate-y-2 opacity-0`;
            toast.innerHTML = `
                <i class="fa-solid ${isSuccess ? 'fa-circle-check text-emerald-400' : 'fa-triangle-exclamation text-rose-400'} text-base"></i>
                <span class="text-xs font-semibold text-slate-200">${message}</span>
            `;
            container.appendChild(toast);
            
            setTimeout(() => { toast.classList.remove('translate-y-2', 'opacity-0'); }, 10);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function togglePasswordVisibility() {
            const passInput = document.getElementById('login-pass');
            const eyeIcon = document.getElementById('eye-icon');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }

        function openForgotPasswordModal() {
            const emailVal = document.getElementById('login-user').value;
            if (emailVal) document.getElementById('recovery-email').value = emailVal;
            document.getElementById('forgot-modal').classList.remove('hidden');
        }

        function closeForgotPasswordModal() {
            document.getElementById('forgot-modal').classList.add('hidden');
        }

        async function sendPasswordRecovery() {
            const email = document.getElementById('recovery-email').value.trim();
            if (!email) {
                showToast("Por favor, informe seu e-mail.", "error");
                return;
            }
            try {
                const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
                    redirectTo: window.location.origin + '/index.html',
                });
                if (error) throw error;
                showToast("Link de recuperação enviado com sucesso!");
                closeForgotPasswordModal();
            } catch (err) {
                showToast("Erro ao solicitar recuperação: " + err.message, "error");
            }
        }

        async function updateNewPassword() {
            const newPassword = document.getElementById('new-password').value.trim();
            if (!newPassword || newPassword.length < 6) {
                showToast("A senha deve ter no mínimo 6 caracteres.", "error");
                return;
            }

            try {
                const { data, error } = await supabaseClient.auth.updateUser({ password: newPassword });
                if (error) throw error;

                showToast("Credencial atualizada com sucesso! Redirecionando...");
                setTimeout(() => {
                    window.location.href = 'painel.html';
                }, 1200);
            } catch (err) {
                showToast("Erro ao atualizar senha: " + err.message, "error");
            }
        }

        async function handleLoginExternal(event) {
            event.preventDefault();
            if (event.submitter === undefined && !window.userDidClickLogin) return;

            const email = document.getElementById('login-user').value.trim();
            const pass = document.getElementById('login-pass').value.trim();
            const rememberMe = document.getElementById('remember-me').checked;
            const submitBtn = document.getElementById('submit-btn');
            const btnIcon = document.getElementById('btn-icon');
            const btnText = document.getElementById('btn-text');
            const loginCard = document.getElementById('login-card');

            if (!email || !pass) return;

            if (rememberMe) {
                localStorage.setItem('saved_login_email', email);
            } else {
                localStorage.removeItem('saved_login_email');
            }

            submitBtn.disabled = true;
            btnIcon.className = 'fa-solid fa-circle-notch fa-spin text-xs';
            btnText.innerText = 'Autenticando...';

            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: pass
                });

                if (error) throw error;

                showToast("Acesso autorizado! Carregando painel...");
                setTimeout(() => {
                    window.location.href = 'painel.html';
                }, 600);

            } catch (err) {
                submitBtn.disabled = false;
                btnIcon.className = 'fa-solid fa-right-to-bracket text-xs';
                btnText.innerText = 'Autenticar na Nuvem';
                
                loginCard.classList.add('shake-error');
                setTimeout(() => loginCard.classList.remove('shake-error'), 400);

                showToast("Credenciais inválidas ou erro de conexão.", "error");
            }
        }

        function calcularDiasUteisAte(strData) {
            if (!strData) return 999;
            const match = strData.match(/(\d{2})\/(\d{2})\/(\d{4})/);
            if (!match) return 999;
            
            const [, d, m, a] = match;
            const targetDate = new Date(`${a}-${m}-${d}`);
            targetDate.setHours(0, 0, 0, 0);

            const today = new Date();
            today.setHours(0, 0, 0, 0);

            if (targetDate < today) return -1;

            let businessDays = 0;
            let current = new Date(today);

            while (current < targetDate) {
                current.setDate(current.getDate() + 1);
                const day = current.getDay();
                if (day !== 0 && day !== 6) {
                    businessDays++;
                }
            }
            return businessDays;
        }

        document.addEventListener('DOMContentLoaded', () => {
            const btn = document.getElementById('submit-btn');
            if (btn) {
                btn.addEventListener('click', () => {
                    window.userDidClickLogin = true;
                });
            }
        });
    </script>
</body>
</html>
